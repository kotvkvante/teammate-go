services:
  teammate-go:
    build:
      context: ..
      dockerfile: docker/teammate-go/Dockerfile
    container_name: teammate-go
    image: kotvkvante/teammate-go:${TAG}
    environment:
      HOST: db
      PORT: 5432
    ports:
      - "8100:8000"
    depends_on:
      - db
  db:
    build:
      context: ..
      dockerfile: docker/db/Dockerfile
    container_name: teammate-db
    image: kotvkvante/teammate-go-db:${TAG}
    environment:
      POSTGRES_PASSWORD: 111
      POSTGRES_USER: postgres
      POSTGRES_DB: db_teammate
    ports:
      - "5450:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: {}
